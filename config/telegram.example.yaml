# latch-telegram configuration: /etc/latch/telegram.yaml (root, mode 0600).
# Check it with: latch-telegram validate, then: sudo latch-telegram doctor

# Your Telegram user id. Only this account is answered, in a private chat
# with the bot; everyone else is ignored. latch-telegram pair fills it in.
owner_id: 123456789

# The bot token from @BotFather, alone in a file (root, mode 0600).
# token_file: /etc/latch/telegram-token
#
# Or take it from an env file a secrets manager writes (KEY=value lines;
# quoted values are fine), still root-only:
# token_file: /run/secrets-broker/latch/secrets.env
# token_key: TELEGRAM_BOT_TOKEN

# Times in the chat show in each reader's own time zone. This zone is only
# for places Telegram cannot localize (button pop-ups, very old apps). An
# IANA name; default: the server's time zone.
# time_zone: Europe/Madrid

# admin_socket: /run/latch/admin.sock
# state_dir: /var/lib/latch-telegram

# Chat with the agent team. Leave this section out to use the bot for
# approvals only.
agent:
  # Shown before every agent answer.
  name: keeper
  # The agent's Linux account (never root). It must be in Latch's socket
  # group so the agent can reach Latch.
  user: keeper
  command: /usr/local/bin/docker-agent
  config: /home/keeper/keeper.yaml
  # Extra Docker Agent flags. Each message runs as:
  #   docker-agent run CONFIG --exec --last --session ID ARGS... -
  # with the message on standard input.
  #
  # Nobody can answer a prompt in Telegram, so use restricted: read-only
  # tools run, everything else is denied. Latch's change tools are not
  # read-only, so list them in the agent config, where Latch's own approval
  # stays the gate:
  #   permissions:
  #     allow: [docker_restart, systemd_restart, docker_stop, docker_start,
  #             systemd_stop, systemd_start, docker_compose_up, file_edit,
  #             file_create, file_restore, http_request]
  # Allowed tools skip pre_tool_use hooks; put checks that must always run
  # under tool_guard instead.
  args: [--safety, restricted]
  # A turn that takes longer is stopped.
  timeout: 10m
  # How many conversations are kept. Older ones are deleted, with their
  # Docker Agent database. /new clears the chat; /sessions brings an
  # earlier conversation and its messages back. Default 5.
  # keep_sessions: 5
  # Scheduled checks: the agent sweeps the server on its own and messages
  # you, in a new conversation, only when it finds something new. Checks
  # never change anything: they run with --safety restricted and this
  # config, a copy of the agent config WITHOUT the permissions allow list
  # for Latch's change tools (latch-telegram refuses one that allows them).
  # /check runs one now.
  # checks:
  #   every: 6h
  #   config: /home/keeper/keeper-check.yaml
