# Latch example configuration.
#
# This file declares WHICH resources an agent may NOT inspect (Docker
# containers, systemd units, files) and which disks and DNS names it may. It
# cannot define commands or arguments, and it can only hide files, never add
# them. Unknown keys are rejected.
# Copy to /etc/latch/config.yaml and edit.

server:
  # Unix socket the agent connects to (Streamable HTTP, endpoint /mcp).
  # Mode is always 0660. Put it in a directory not writable by "other".
  socket: /run/latch/latch.sock
  # Group that owns the socket. Only processes in this group may connect
  # (checked by file permissions and again with kernel-verified peer
  # credentials). Add the agent's user to it. Root's group is refused.
  socket_group: latch-agents

limits:
  max_log_lines: 200      # hard ceiling 1000
  max_log_bytes: 65536    # hard ceiling 262144

audit:
  # Empty = stderr (captured by journald under systemd).
  file: ""

docker:
  socket: /var/run/docker.sock
  # Every container is visible to the agent (state, health, recent logs, all
  # bounded by limits) EXCEPT the ones named here. Logs often contain secrets,
  # so exclude containers that log them. A new container is visible as soon as
  # it exists, so review this list when you add one.
  # Names are exact; * matches any run of characters and ? one character.
  exclude:
    - secrets-broker
    - vault-*

systemd:
  # Every unit is visible to the agent EXCEPT the full unit names listed here.
  exclude:
    - vault.service

host:
  disks:
    - name: root
      path: /
    - name: data
      path: /var/lib

health:
  dns:
    - name: example
      host: example.com

files:
  # The agent can read, list and search any file on the disk EXCEPT these
  # (always blocked, whatever this list says): /proc, /sys, /dev, /etc/shadow,
  # /etc/gshadow and their "-" backups, SSH host keys (/etc/ssh/*_key), every
  # file in a .ssh folder except *.pub, authorized_keys, known_hosts and
  # config, files named *.key, *.pem, .env and .env.*, /var/lib/docker,
  # /etc/latch, /var/lib/latch, this config file, the home folders of the
  # users in server.socket_group, and folders mounted into excluded
  # containers. Blocked files behave as if they do not exist.
  # Each entry is an absolute path (blocks that file or the whole folder) or a
  # file name with optional * and ? wildcards and no slash (blocks every file
  # or folder with that name, anywhere).
  exclude:
    - /srv/backups
    - "*.secret"

network:
  # The network tools (ping, DNS, TCP, traceroute, HTTP GET) may reach any
  # address, including this host and the LAN. Excluded containers are blocked
  # automatically: their addresses, and their published ports on this host.
  # List other hostnames or IP addresses to block here. Names are exact (no
  # wildcards) and case does not matter.
  exclude: []
