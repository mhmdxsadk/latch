version: "2"
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - misspell
    - unconvert
    - nilerr
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors are covered by errcheck, with its own exclusions
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*os.File).Close
        - os.Remove
        - (*net/http.Server).Shutdown
  exclusions:
    rules:
      - path: _test\.go
        linters: [noctx, gosec, errcheck]
formatters:
  enable:
    - gofmt
    - goimports
